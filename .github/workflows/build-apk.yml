name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare web app
        run: |
          set -e
          mkdir -p www

          HTML_FILE=$(find . -maxdepth 2 -type f -name "*.html" \
            ! -path "./www/*" \
            ! -path "./android/*" | head -n 1)

          if [ -z "$HTML_FILE" ]; then
            echo "ERROR: No HTML file found."
            exit 1
          fi

          echo "HTML file found: $HTML_FILE"
          cp "$HTML_FILE" www/index.html

          echo "Web app prepared:"
          ls -la www

      - name: Create package.json
        run: |
          cat > package.json <<'EOF'
          {
            "name": "exam-panel-app",
            "version": "1.0.0",
            "private": true
          }
          EOF

      - name: Install Capacitor
        run: |
          npm install @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.meraj.exam',
            appName: 'پنل آمادگی آزمون جامع',
            webDir: 'www'
          };

          export default config;
          EOF

      - name: Add Android
        run: |
          npx cap add android

      - name: Sync Android
        run: |
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: exam-panel-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
